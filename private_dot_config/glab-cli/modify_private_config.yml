{{- /* chezmoi:modify-template */ -}}
{{- $raw := .chezmoi.stdin | default "" -}}
{{- $config := dict -}}
{{- if $raw -}}
{{- $parsed := fromYaml $raw -}}
{{- if $parsed -}}
{{- $config = $parsed -}}
{{- end -}}
{{- end -}}
{{- $useKeyring := or (eq .chezmoi.os "darwin") (not .headless) -}}
{{- $config = mergeOverwrite $config (dict
  "git_protocol" "ssh"
  "glamour_style" "dark"
  "check_update" false
  "display_hyperlinks" true
  "telemetry" false
  "host" "gitlab.com"
  "no_prompt" false
  "hosts" (dict
    "gitlab.com" (dict
      "api_protocol" "https"
      "api_host" "gitlab.com"
    )
    "gitlab-ce.alauda.cn" (dict
      "api_host" "gitlab-ce.alauda.cn"
      "git_protocol" "https"
      "api_protocol" "https"
      "use_keyring" $useKeyring
      "container_registry_domains" "gitlab-ce.alauda.cn,gitlab-ce.alauda.cn:443"
    )
    "code.alauda.io" (dict
      "api_host" "code.alauda.io"
      "git_protocol" "https"
      "api_protocol" "https"
      "use_keyring" $useKeyring
      "container_registry_domains" "code.alauda.io,code.alauda.io:443,registry.code.alauda.io"
    )
  )
) -}}
{{- $config | toYaml -}}
