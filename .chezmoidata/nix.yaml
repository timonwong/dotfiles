nix:
  sysPkgs:
    - gitFull
    - coreutils-prefixed # GNU coreutils with g* names so they do not shadow BSD tools
  homepkgs:
    shared:
      - sheldon # shell plugin manager (prefer nix build over aqua binary on macOS)
      - openssh
      - openssl
      - statix # Nix linter
      - nixfmt
      - zstd
      - eza
      - shfmt
      - ouch
    work: []
    private:
      - btop
      - ffmpeg
