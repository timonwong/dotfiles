name: Update toolchains
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    name: Update aqua + mise managed versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Install aqua (official installer)
        run: |
          set -euo pipefail

          aqua_installer="$(awk '/^[[:space:]]*aquaInstaller:/ {print $2; exit}' .chezmoidata/versions.yaml)"
          aqua_installer_sha256="$(awk '/^[[:space:]]*aquaInstallerSha256:/ {print $2; exit}' .chezmoidata/versions.yaml)"
          aqua_version="$(awk '/^[[:space:]]*aquaVersion:/ {print $2; exit}' .chezmoidata/versions.yaml)"

          if [[ -z "$aqua_installer" ]] || [[ -z "$aqua_installer_sha256" ]] || [[ -z "$aqua_version" ]]; then
            echo "Failed to parse aqua versions from .chezmoidata/versions.yaml" >&2
            exit 1
          fi

          installer_dir="$(mktemp -d)"
          trap 'rm -rf "$installer_dir"' EXIT
          installer_path="${installer_dir}/aqua-installer"

          curl -fsSL "https://raw.githubusercontent.com/aquaproj/aqua-installer/${aqua_installer}/aqua-installer" -o "${installer_path}"
          echo "${aqua_installer_sha256}  ${installer_path}" | sha256sum -c -
          chmod +x "${installer_path}"
          "${installer_path}" -v "${aqua_version}"
          echo "${AQUA_ROOT_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/aquaproj-aqua}/bin" >> "$GITHUB_PATH"

      - name: Update private_dot_config/aquaproj-aqua/aqua.yaml
        env:
          AQUA_GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          aqua --version
          AQUA_CONFIG=private_dot_config/aquaproj-aqua/aqua.yaml aqua update -p

      - uses: jdx/mise-action@v3

      - name: Discover managed mise tools
        id: discover
        run: |
          set -euo pipefail
          config_file="private_dot_config/mise/conf.d/managed-tools.toml"
          tools_file="$(mktemp)"

          awk '
            /^[[:space:]]*#/ { next }
            /^[[:space:]]*\[/ { next }
            /=[[:space:]]*"[^"]+"/ {
              if ($0 !~ /=[[:space:]]*"[^"]+"/) next

              key = $0
              sub(/[[:space:]]*=[[:space:]]*"[^"]+".*$/, "", key)
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", key)
              sub(/^"/, "", key)
              sub(/"$/, "", key)

              if (key != "") print key
            }
          ' "$config_file" >"$tools_file"

          if [[ ! -s "$tools_file" ]]; then
            echo "No managed tools found in $config_file" >&2
            exit 1
          fi

          {
            echo "tools<<EOF"
            cat "$tools_file"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Update managed mise tool versions
        run: |
          set -euo pipefail
          config_file="private_dot_config/mise/conf.d/managed-tools.toml"
          updates_file="$(mktemp)"

          while IFS= read -r tool; do
            [[ -n "$tool" ]] || continue
            latest="$(mise latest "$tool")"
            printf '%s=%s\n' "$tool" "$latest" >> "$updates_file"
            echo "updated ${tool} -> ${latest}"
          done <<<"${{ steps.discover.outputs.tools }}"

          python3 - "$config_file" "$updates_file" <<'PY'
          import re
          import sys

          config_path = sys.argv[1]
          updates_path = sys.argv[2]

          with open(config_path, "r", encoding="utf-8") as f:
            content = f.read()

          updates = {}
          with open(updates_path, "r", encoding="utf-8") as f:
            for line in f:
              line = line.strip()
              if not line:
                continue
              tool, version = line.split("=", 1)
              updates[tool] = version

          for tool, version in updates.items():
            escaped = re.escape(tool)
            patterns = [
              rf'^(\s*"{escaped}"\s*=\s*")[^"]*(".*)$',
              rf'^(\s*{escaped}\s*=\s*")[^"]*(".*)$',
            ]
            replaced = False
            for pattern in patterns:
              next_content, n = re.subn(pattern, rf"\g<1>{version}\g<2>", content, flags=re.MULTILINE)
              if n > 0:
                content = next_content
                replaced = True
                break
            if not replaced:
              raise SystemExit(f"Failed to update tool key in {config_path}: {tool}")

          with open(config_path, "w", encoding="utf-8") as f:
            f.write(content)
          PY

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- private_dot_config/aquaproj-aqua/aqua.yaml private_dot_config/mise/conf.d/managed-tools.toml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Get current date
        if: steps.changes.outputs.changed == 'true'
        id: date
        run: echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Create PR
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          add-paths: |
            private_dot_config/aquaproj-aqua/aqua.yaml
            private_dot_config/mise/conf.d/managed-tools.toml
          commit-message: "chore(toolchains): update aqua and mise managed versions"
          title: "chore(toolchains): update aqua and mise managed versions (${{ steps.date.outputs.date }})"
          branch: update-toolchains
          labels: dependencies,automation,aqua,mise
          body: |
            Automated update for:
            - `private_dot_config/aquaproj-aqua/aqua.yaml` via `aqua update -p`
            - `private_dot_config/mise/conf.d/managed-tools.toml`
